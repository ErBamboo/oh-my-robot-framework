# Boot layout source for rm-a-board (STM32F427, 2 MB flash).
#
# Offsets in this file are flash-relative. The generator adds flash.base when
# producing absolute linker addresses.
#
# This file is the source of truth for:
# - generated om_bootcfg.h / OM_BOOT_PARTITIONS
# - generated boot_partition_data.c
# - generated om_layout.json
# - generated layout fingerprint
#
# Do not edit the generated files by hand.

schema = 1
board = "rm-a-board"
device = "flash0"

payload_offset = 0x200
meta_copies = 2
rollback_limit = 3

[flash]
base = 0x08000000
size = 0x00200000

# Each entry is one contiguous erase-size region. offsets are flash-relative.
erase_regions = [
    { offset = 0x000000, size = 0x004000, count = 4 },
    { offset = 0x010000, size = 0x010000, count = 1 },
    { offset = 0x020000, size = 0x020000, count = 7 },
    { offset = 0x100000, size = 0x004000, count = 4 },
    { offset = 0x110000, size = 0x010000, count = 1 },
    { offset = 0x120000, size = 0x020000, count = 7 },
]

[[partitions]]
name = "bootloader"
offset = 0x000000
size = 0x010000
role = "bootloader"

[[partitions]]
name = "app_a"
offset = 0x010000
size = 0x0F0000
role = "app"
slot = "a"

[[partitions]]
name = "meta"
offset = 0x100000
size = 0x008000
role = "meta"

[[partitions]]
name = "meta_resv"
offset = 0x108000
size = 0x004000
role = "meta_resv"

[[partitions]]
name = "app_b"
offset = 0x110000
size = 0x0F0000
role = "app"
slot = "b"

# Reserved gap between meta_resv and app_b. It is still checked for overlap.
[[reserved]]
offset = 0x10C000
size = 0x004000
name = "reserved"
